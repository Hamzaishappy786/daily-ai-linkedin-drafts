name: Daily AI LinkedIn draft

on:
  schedule:
    # GitHub cron is UTC. 04:00 UTC = 9am PKT, 14:00 UTC = 7pm PKT. Change if elsewhere.
    - cron: "0 4 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch: # press "Run workflow" manually to get more drafts
    inputs:
      count:
        description: "How many drafts (1-6)"
        default: "2"
      mode:
        description: "Force a type (optional)"
        type: choice
        default: "RANDOM"
        options: [RANDOM, NEWS, TIP, QUOTE, FUNNY, MOTIVATION, HISTORY]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate drafts and email them
        run: python scripts/daily_post.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_COUNT: ${{ inputs.count }}
          FORCE_MODE: ${{ inputs.mode }}
